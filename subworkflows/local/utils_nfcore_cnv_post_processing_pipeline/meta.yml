# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: pipeline_initialisation
description: |
  Subworkflow with functionality specific to the Ferlab-Ste-Justine/cnv-post-processing pipeline.
  Provides two workflows: PIPELINE_INITIALISATION (version/help handling, parameter validation,
  config checks, and building the samplesheet channel -- including this pipeline's own
  familyId-grouping and family-level PED/phenopacket/joint-caller validation) and
  PIPELINE_COMPLETION (writes pipeline_info/ metadata, configs, and log on completion or error).
keywords:
  - utility
  - pipeline
  - initialise
  - completion
  - samplesheet
components:
  - completionsummary
  - utils_nextflow_pipeline
  - utils_nfcore_pipeline
  - utils_nfschema_plugin
input:
  - version:
      type: boolean
      description: Display version and exit
  - validate_params:
      type: boolean
      description: Whether to validate parameters against the schema at runtime
  - monochrome_logs:
      type: boolean
      description: Do not use coloured log outputs
  - nextflow_cli_args:
      type: list
      description: List of positional nextflow CLI args
  - outdir:
      type: string
      description: The output directory where the results will be saved
  - input:
      type: string
      description: Path to input samplesheet
output:
  - samplesheet:
      type: channel
      description: |
        Validated, family-grouped samplesheet channel
        Structure: [ val(meta), path(vcf), path(cram) ]
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ferlab"
maintainers:
  - "@ferlab"
