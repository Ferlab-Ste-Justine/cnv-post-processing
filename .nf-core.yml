repository_type: pipeline

nf_core_version: 3.2.0

lint:
  files_unchanged:
    - docs/README.md
    - .github/CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/linting.yml
    - .prettierignore
    - LICENSE

  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
    # the nf-core/configs includeConfig lines are deliberately commented out in nextflow.config
    # (see the comment there) so no external config/profile is ever auto-loaded from a remote
    # source -- this check expects them present and would otherwise always fail here.
    - custom_config
    - config_defaults:
        - params.exomiser_analysis_wes # projectDir variable not rendered is causing mismatch with nextflow.config
        - params.exomiser_analysis_wgs # projectDir variable not rendered is causing mismatch with nextflow.config

  multiqc_config: false

  files_exist:
    - assets/email_template.html
    - assets/email_template.txt
    - assets/multiqc_config.yml
    - assets/nf-core-cnv-post-processing_logo_light.png
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - docs/images/nf-core-cnv-post-processing_logo_light.png
    - docs/images/nf-core-cnv-post-processing_logo_dark.png
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - ro-crate-metadata.json
    # nf-core's sharded nf-test CI matrix scaffolding -- this repo uses its own
    # single-job .github/workflows/ci-nf-test.yml instead.
    - .github/workflows/nf-test.yml
    - .github/workflows/pr-comment.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    # actual file lives at .github/CONTRIBUTING.md (already in files_unchanged above)
    - docs/CONTRIBUTING.md

  readme:
    - nextflow_badge

  actions_ci: false
  pipeline_name_conventions: false

template:
  org: Ferlab-Ste-Justine
  name: cnv-post-processing
  description: Nextflow pipeline dedicated to the post-processing of Copy Number Variants
    (CNVs).
  author: "Lysiane Bouchard, Georgette Femerling, Félix-Antoine Le Sieur, David Morais"
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - github_badges
    - gitpod
    - codespaces
    - multiqc
    - fastqc
    - email
    - adaptivecard
    - slackreport
    - seqera_platform
    - rocrate
    - vscode
  is_nfcore: false
